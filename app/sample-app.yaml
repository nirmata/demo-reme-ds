apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-alpha
  namespace: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-alpha
  template:
    metadata:
      labels:
        app: app-alpha
        team: test
        app.kubernetes.io/name: app-alpha
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app-alpha
        image: busybox
        image: busybox:1.36
        command: ["sleep", "3600"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
            - CAP_NET_RAW
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "echo alive"
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: host-volume
          mountPath: /host
      volumes:
      - name: host-volume
        emptyDir: {}
